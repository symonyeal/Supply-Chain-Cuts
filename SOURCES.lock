    "A66": "1Table includes data available through November 13, 2024. All data are reported unless otherwise noted; totals may include estimated data. Grand totals and estimated data are rounded to no more than three significant digits; may not add to totals shown.",
    "A67": "2Primary nickel refers to a nickel product ready for use by downstream consuming industries such as nickel chemicals and salts, ferronickel, nickel metal in various forms, nickel oxide sinter, and nickel pig iron. The U. S. Geological Survey  does not use the terms Class I and Class II nickel as defined by the International Nickel Study Group (INSG). However, nickel metal reported here is generally equivalent to Class I nickel which is defined by the INSG as nickel with a minimum nickel content of 99% in the form of briquettes, cathodes (in other words, electrolytic nickel), flakes or powders, granules, pellets, and rondelles. Ferronickel, nickel oxide sinter, and nickel pig iron are classified by the INSG as Class II. Chemicals, although typically produced at refineries, are differentiated from production of metal when feasible. Several countries produced nickel-containing matte and other intermediates, but output of nickel in such materials has been excluded from this table to avoid double counting. Countries that produced intermediate products for export are listed in table 11.",
