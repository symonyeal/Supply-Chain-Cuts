[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["slow: full-network cut-set enumeration or importance sampling over the sweep"]

[tool.ruff]
line-length = 100
# One-off session scripts, kept as the record of how results were produced.
extend-exclude = ["docs/history", "local"]

[tool.ruff.lint]
# E501 is not in ruff's default selection; select it so line-length is enforced.
extend-select = ["E501"]
# E741 rejects l, I and O as names; the sources use them as symbols.
# I001 wraps imports one name per line, against the compact register of these files.
ignore = ["E741", "I001"]
