name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/evidence/rust-target
      CUT_RISK_BIN: ${{ github.workspace }}/evidence/rust-target/release/cut-risk
      SUPPLY_BIN: ${{ github.workspace }}/evidence/rust-target/release/supply
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt
      - run: cargo build --workspace --release --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --release --locked -- -D warnings
      - run: cargo test --workspace --release --locked
      - run: python -m pytest -q --basetemp evidence/pytest
      - run: python -m ruff check .
      - run: python -m pip check
      - run: python -m analysis.check_rust --binary "$CUT_RISK_BIN" --out evidence/rust
      - run: python -m analysis.check_native_pipeline --binary "$SUPPLY_BIN" --out evidence/native-pipeline
      - run: '"$SUPPLY_BIN" build'
      - run: git diff --exit-code -- site/data.js site/context.js site/context.csv
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python analysis/check_explorer.py --out evidence/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            evidence/rust/*.json
            evidence/native-pipeline/**
            evidence/browser/*
